[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-music-popularity"
version = "0.1.0"
description = "Pipeline reproduzível da Base v0.1 do TCC sobre popularidade musical"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "polars>=1.15",
  "pyarrow>=18",
  "PyYAML>=6.0",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
tcc-music = "tcc_music_popularity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
