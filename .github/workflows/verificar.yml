name: Verificações leves do repositório

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Código e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar ferramentas de verificação e dependência das fixtures
        run: python -m pip install pytest ruff polars==1.43.2
      - name: Auditar os arquivos versionados
        run: PYTHONPATH=src python scripts/30_auditar_publicacao_git.py
      - name: Verificar a sintaxe dos códigos
        run: python -m compileall -q src scripts
      - name: Conferir os códigos de publicação
        run: ruff check src/tcc_music_popularity/git_publication.py scripts/30_auditar_publicacao_git.py tests/test_git_publication.py
      - name: Testar publicação e normalização com fixtures
        run: PYTHONPATH=src python -m pytest tests/test_git_publication.py tests/test_normalization.py
